<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Stremio Server</title>
</head>
<body>
<!-- This page is not a UI: it is the trigger that starts the service. The
     Control API can launch the app but nothing else, and on-boot does not
     fire for sideloaded services on this firmware — so the page does what
     the homebrew TV screen does: ask the platform to start the service,
     then exit. The service is its own application and outlives this page;
     a hidden page would keep a whole web runtime resident (72 MB on a
     CU7105) for nothing. The homebrew service launches this page again
     whenever port 11470 goes silent. -->
<script>
'use strict';

(function () {
    var log = '/opt/usr/home/owner/apps_rw/S6K2WQ8MnP/data/stremio-server/boot.log';

    var note = function (msg) {
        try {
            require('fs').appendFileSync(log, '[' + new Date().toISOString() + '] ' + msg + '\n');
        } catch (e) { }
    };

    note('page loaded');

    var launch = function () {
        tizen.application.launchAppControl(
            new tizen.ApplicationControl('http://tizen.org/appcontrol/operation/service'),
            'S6K2WQ8MnP.StremioServerService',
            function () {
                note('service launched');
                leave();
            },
            function (e) {
                note('service launch failed: ' + e.message);
                leave();
            }
        );
    };

    var leave = function () {
        note('exiting');

        try {
            tizen.application.getCurrentApplication().exit();
            return;
        } catch (exitError) {
            note('exit failed: ' + exitError.message + '; hiding instead');
        }

        try {
            tizen.application.getCurrentApplication().hide();
        } catch (hideError) {
            note('hide failed: ' + hideError.message);
        }
    };

    setTimeout(launch, 500);
})();
</script>
</body>
</html>
